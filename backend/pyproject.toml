[project]
name = "whiteboard-backend"
version = "0.1.0"
description = "Collaborative live whiteboard backend for theblueai.org"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    # AT Protocol OAuth: JWK handling, ES256 client assertions, DPoP proofs
    # and S256 PKCE challenges.
    "authlib>=1.3.0",
    # Optional but preferred: handle resolution via _atproto DNS TXT records.
    # Without it we fall back to the HTTPS well-known, which every account on
    # pds.theblueai.org publishes.
    "dnspython>=2.6.0",
    # Server-side rasterization for GET /canvases/{id}/render.
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
# Tests that talk to the live PDS are opt-in: `pytest -m network`.
addopts = "-m 'not network'"
markers = [
    "network: hits the real PDS at pds.theblueai.org (opt-in, needs internet)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
