# Merge into the PDS host's existing docker-compose.yml.
#
# NOTE the build context: the repo ROOT, with the Dockerfile named explicitly.
# backend/Dockerfile is multi-stage and builds the frontend from ../frontend,
# so a context of ./backend cannot see the source it needs.
services:
  whiteboard-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: /opt/whiteboard/.env
    environment:
      WB_PG_HOST: 127.0.0.1
    volumes:
      - /opt/whiteboard/.env:/app/.env:ro
    # network_mode: host means the container reaches Postgres and bsky-mcp on
    # 127.0.0.1, and Caddy reaches the backend on 127.0.0.1:8092. No port
    # mapping is needed (or possible) in this mode.
    network_mode: host
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
